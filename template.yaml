AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  WOW Beacon - Who Owns What people finder. One stack: S3 + CloudFront (web),
  HTTP API + one Lambda (API), DynamoDB (people, leave), Bedrock (Claude Haiku), Cognito (sign-in).

Parameters:
  StageName:
    Type: String
    Default: demo
  CognitoDomainPrefix:
    Type: String
    Description: Globally unique prefix for the Cognito Hosted UI, e.g. wow-beacon-yourteam
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-haiku-20240307-v1:0
    Description: Model or inference-profile ID enabled in your Bedrock console for this region
  AiEnabled:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
  CalendarProvider:
    Type: String
    Default: mock
    AllowedValues: [mock, graph, none]
  GraphTenantId:
    Type: String
    Default: ""
  GraphClientId:
    Type: String
    Default: ""
  GraphClientSecretArn:
    Type: String
    Default: ""
    Description: Secrets Manager ARN holding the Entra ID client secret (only for CalendarProvider=graph)

Conditions:
  UseGraph: !Not [!Equals [!Ref GraphClientSecretArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10
    Tracing: Active

Resources:
  # ------------------------------------------------------------------ data
  PeopleTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  LeaveTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: personId, AttributeType: S }
        - { AttributeName: leaveId, AttributeType: S }
      KeySchema:
        - { AttributeName: personId, KeyType: HASH }
        - { AttributeName: leaveId, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      SSESpecification: { SSEEnabled: true }

  # ------------------------------------------------------------------ auth
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      Policies:
        PasswordPolicy: { MinimumLength: 12, RequireLowercase: true, RequireNumbers: true, RequireUppercase: true, RequireSymbols: false }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !Sub https://${WebDistribution.DomainName}/
        - http://localhost:5173/
      LogoutURLs:
        - !Sub https://${WebDistribution.DomainName}/
        - http://localhost:5173/
      IdTokenValidity: 8
      TokenValidityUnits: { IdToken: hours }
      PreventUserExistenceErrors: ENABLED

  LeadGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: lead, UserPoolId: !Ref UserPool, Description: Team leads - can update leave for their own team }
  HrGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: hr, UserPoolId: !Ref UserPool, Description: HR - can update leave for any team }
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { GroupName: admin, UserPoolId: !Ref UserPool, Description: Admins - can upload the directory CSV }

  # ------------------------------------------------------------------ API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref StageName
      DefaultRouteSettings: { ThrottlingBurstLimit: 50, ThrottlingRateLimit: 20 }
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${WebDistribution.DomainName}
          - http://localhost:5173
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/src/
      Handler: beacon.app.handler
      Environment:
        Variables:
          PEOPLE_TABLE: !Ref PeopleTable
          LEAVE_TABLE: !Ref LeaveTable
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          BEACON_AI: !Ref AiEnabled
          BEACON_TZ: Asia/Singapore
          CALENDAR_PROVIDER: !Ref CalendarProvider
          GRAPH_TENANT_ID: !Ref GraphTenantId
          GRAPH_CLIENT_ID: !Ref GraphClientId
          GRAPH_CLIENT_SECRET_ARN: !Ref GraphClientSecretArn
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PeopleTable }
        - DynamoDBCrudPolicy: { TableName: !Ref LeaveTable }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel]
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
        - !If
          - UseGraph
          - Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref GraphClientSecretArn
          - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/api/{proxy+}"
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 14

  # ------------------------------------------------------------------ web
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebOac:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: WOW Beacon web
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOac.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03  # Managed-SecurityHeadersPolicy
          Compress: true
        CustomErrorResponses:   # SPA routing
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  WebUrl:
    Value: !Sub https://${WebDistribution.DomainName}
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref WebDistribution
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoDomain:
    Value: !Sub https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com
  PeopleTableName:
    Value: !Ref PeopleTable
  LeaveTableName:
    Value: !Ref LeaveTable
